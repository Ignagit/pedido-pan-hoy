<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedido Hoy</title>
<style>
  :root {
    --cell-font: 15px;
    --cyan: #0891b2;
    --cyan-dark: #0e7490;
    --ink: #0f172a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 10px 32px;
  }

  h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .01em;
    margin: 0 0 14px;
    text-align: center;
  }

  /* ---- Interruptor (toggle) ---- */
  .toggle-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .toggle-label { font-size: 19px; font-weight: 700; }
  .switch {
    position: relative;
    display: inline-block;
    width: 76px;
    height: 42px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #cbd5e1;
    transition: background .2s ease;
    border-radius: 42px;
  }
  .slider:before {
    content: "";
    position: absolute;
    height: 34px;
    width: 34px;
    left: 4px;
    bottom: 4px;
    background: #ffffff;
    transition: transform .2s ease;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .switch input:checked + .slider { background: var(--cyan); }
  .switch input:checked + .slider:before { transform: translateX(34px); }
  .switch input:disabled + .slider { opacity: .5; cursor: progress; }

  /* ---- CTAs de la cabecera ---- */
  .cta-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .cta {
    border: none;
    border-radius: 14px;
    background: var(--cyan);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(8,145,178,.28);
    transition: transform .14s ease, background .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cta:hover { background: var(--cyan-dark); }
  .cta:active { transform: scale(.95); box-shadow: 0 2px 8px rgba(8,145,178,.22); }
  .cta-icon { flex: 0 0 58px; height: 58px; }
  .cta-icon svg { width: 26px; height: 26px; display: block; }
  .cta-complete {
    flex: 1;
    height: 58px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: .02em;
  }

  /* ---- Estado / mensajes ---- */
  .status {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    min-height: 20px;
    margin-bottom: 10px;
  }
  .status.error { color: #dc2626; font-weight: 700; }

  /* ---- Tabla (dashboard premium) ---- */
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(15,23,42,.06);
    background: #ffffff;
  }
  .table-scroll.fit { overflow: hidden; }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: var(--cell-font);
    transform-origin: top left;
  }
  thead th {
    background: #f8fafc;
    color: #475569;
    font-weight: 700;
    font-size: .8em;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 11px 12px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 2px solid #e2e8f0;
    position: sticky;
    top: 0;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    padding: 9px 12px;
    text-align: center;
    white-space: nowrap;
    color: #1f2937;
    border-bottom: 1px solid #f1f5f9;
  }
  tbody td:first-child { text-align: left; font-weight: 600; }
  tbody tr:nth-child(even) { background: #fafcff; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover, tbody tr:active { background: #ecfeff; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Interruptor -->
  <div class="toggle-box">
    <span class="toggle-label">🥖 Pedido Hoy 🥖</span>
    <label class="switch">
      <input type="checkbox" id="toggleActivos">
      <span class="slider"></span>
    </label>
  </div>

  <!-- CTAs de la cabecera -->
  <div class="cta-bar">
    <button id="btnZoomOut" class="cta cta-icon" aria-label="Reducir zoom general (más contenido visible)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
    </button>
    <button id="btnZoomIn" class="cta cta-icon" aria-label="Aumentar tamaño del texto de la tabla">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
      </svg>
    </button>
    <button id="btnZoomFit" class="cta cta-complete" aria-label="Ver la tabla completa en pantalla">Complete View</button>
  </div>

  <div class="status" id="status">Cargando…</div>

  <div class="table-scroll" id="tableScroll">
    <table id="dataTable">
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
/* ============================================================
   1) CONFIGURACIÓN  —  PEGA AQUÍ TU URL DE APPS SCRIPT
   ============================================================
   Después de desplegar el Apps Script como aplicación web,
   copia la URL que termina en /exec y pégala entre las comillas
   de abajo (reemplaza el texto PEGA_AQUI...).                     */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUCIQhS-A31S0gJIFE9G5Bio-d59fozLBiRF4Qz4eF6GRlo6HsxtUqM0tIB273crnl/exec";
/* ============================================================ */

// URL del CSV publicado del Google Sheet (fuente de datos).
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1BjbiQM-QP0XSjShP74iarll9RqMh41FakufDxFL6Zdpuih_Uis-PjGpl0soEFqFm2mU3Kpr9hNZL/pub?gid=121579684&single=true&output=csv";

// Columnas que se mostrarán (en este orden).
const COLUMNS = ["Fecha Entrega", "Apto", "Normal", "Sobao", "Matalauva"];

const statusEl = document.getElementById('status');
const theadRow = document.getElementById('theadRow');
const tbody    = document.getElementById('tbody');
const tableEl  = document.getElementById('dataTable');
const scrollEl = document.getElementById('tableScroll');
const toggleEl = document.getElementById('toggleActivos');

let fontSize = 15;
let viewMode = 'fit'; // 'fit' = tabla completa en pantalla | 'normal' = zoom manual

function applyFont() {
  document.documentElement.style.setProperty('--cell-font', fontSize + 'px');
}

/* ---------- Parser CSV (soporta comillas y comas internas) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* ignorar */ }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

/* ---------- Cargar datos del Sheet (sin caché) ---------- */
async function loadData() {
  setStatus("Cargando…", false);
  try {
    const url = CSV_URL + "&_cb=" + Date.now(); // evita la caché
    const resp = await fetch(url, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    renderTable(parseCSV(text));
    setStatus("", false);
    if (viewMode === 'fit') completeView(); // reajustar al nuevo contenido
  } catch (err) {
    setStatus("No se pudieron cargar los datos. Revisa la conexión. (" + err.message + ")", true);
  }
}

function renderTable(rows) {
  theadRow.innerHTML = "";
  tbody.innerHTML = "";
  if (!rows.length) { setStatus("La hoja no tiene datos.", true); return; }

  const header = rows[0].map(h => h.trim());

  // Localizar las columnas pedidas por nombre.
  let indices = COLUMNS.map(name => {
    const wanted = name.trim().toLowerCase();
    return header.findIndex(h => h.toLowerCase() === wanted);
  });

  let labels = COLUMNS.slice();
  // Si no se encontró ninguna columna por nombre, mostrar todas.
  if (indices.every(i => i === -1)) {
    indices = header.map((_, i) => i);
    labels  = header;
  }

  indices.forEach((idx, k) => {
    const th = document.createElement('th');
    th.textContent = (idx === -1) ? labels[k] : header[idx];
    theadRow.appendChild(th);
  });

  for (let r = 1; r < rows.length; r++) {
    const cells = rows[r];
    if (cells.every(v => (v || "").trim() === "")) continue; // saltar filas vacías
    const tr = document.createElement('tr');
    indices.forEach(idx => {
      const td = document.createElement('td');
      td.textContent = (idx === -1 || cells[idx] === undefined) ? "" : cells[idx];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
}

/* ---------- Interruptor: escribir TRUE/FALSE en F2 ---------- */
async function setFilter(isOn) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PEGA_AQUI") === 0) {
    setStatus("Falta pegar la URL del Apps Script en el código.", true);
    toggleEl.checked = !isOn; // revertir el interruptor
    return;
  }
  toggleEl.disabled = true;
  setStatus("Guardando…", false);
  try {
    const value = isOn ? "TRUE" : "FALSE";
    await fetch(APPS_SCRIPT_URL + "?value=" + value, { method: "GET" });
    localStorage.setItem("soloActivos", value);
    await loadData(); // recargar datos ya filtrados
  } catch (err) {
    setStatus("No se pudo guardar el cambio. (" + err.message + ")", true);
    toggleEl.checked = !isOn; // revertir el interruptor
  } finally {
    toggleEl.disabled = false;
  }
}

/* ---------- Zoom / Vista completa ---------- */
function clearFit() {
  viewMode = 'normal';
  scrollEl.classList.remove('fit');
  tableEl.style.transform = 'none';
  scrollEl.style.height = '';
}

// Lupa - : reduce el zoom general (más filas/contenido visible).
function zoomOut() {
  clearFit();
  fontSize = Math.max(fontSize - 2, 7);
  applyFont();
}

// Lupa + : aumenta solo el tamaño del texto de la tabla.
function zoomIn() {
  clearFit();
  fontSize = Math.min(fontSize + 2, 44);
  applyFont();
}

// Complete View : escala la tabla para que quepa ENTERA en pantalla (sin scroll horizontal).
function completeView() {
  viewMode = 'fit';
  fontSize = 15;
  applyFont();
  tableEl.style.transform = 'none';
  scrollEl.classList.add('fit');
  scrollEl.style.height = '';

  requestAnimationFrame(() => {
    const natW   = tableEl.scrollWidth;
    const availW = scrollEl.clientWidth;
    let scale = (natW > 0) ? (availW / natW) : 1;
    if (scale > 1) scale = 1;
    const natH = tableEl.offsetHeight;
    tableEl.style.transform = 'scale(' + scale + ')';
    scrollEl.style.height = Math.ceil(natH * scale) + 'px';
  });
}

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (isError ? " error" : "");
}

/* ---------- Eventos ---------- */
document.getElementById('btnZoomOut').addEventListener('click', zoomOut);
document.getElementById('btnZoomIn').addEventListener('click', zoomIn);
document.getElementById('btnZoomFit').addEventListener('click', completeView);
toggleEl.addEventListener('change', () => setFilter(toggleEl.checked));
window.addEventListener('resize', () => { if (viewMode === 'fit') completeView(); });

// Recuerda la posición del interruptor entre recargas (no reescribe F2 al cargar).
if (localStorage.getItem("soloActivos") === "TRUE") toggleEl.checked = true;

applyFont();
loadData();
</script>
</body>
</html>
