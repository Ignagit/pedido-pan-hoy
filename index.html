<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedido Hoy</title>
<style>
  :root {
    --cell-font: 15px;
    --cyan: #0891b2;
    --cyan-dark: #0e7490;
    --green: #16a34a;
    --green-dark: #15803d;
    --ink: #0f172a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 10px 12px;
  }

  /* ---- Cabecera fija de la página ---- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: #ffffff;
    padding-bottom: 8px;
  }

  .cta-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cta {
    border: none;
    border-radius: 14px;
    background: var(--cyan);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(8,145,178,.28);
    transition: transform .14s ease, background .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .cta:hover { background: var(--cyan-dark); }
  .cta:active { transform: scale(.94); box-shadow: 0 2px 8px rgba(8,145,178,.22); }

  .cta-icon { flex: 0 0 48px; height: 54px; }
  .cta-icon svg { width: 24px; height: 24px; display: block; }

  .cta-complete {
    flex: 1;
    height: 54px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .01em;
    line-height: 1.1;
    padding: 0 8px;
    white-space: normal;
    text-align: center;
  }
  .cta-complete svg { width: 20px; height: 20px; flex: 0 0 auto; }

  /* ---- Interruptor MES | switch | HOY ---- */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .t-label {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .06em;
    color: #94a3b8;
    transition: color .2s ease;
    user-select: none;
  }
  #lblMes.active { color: var(--cyan-dark); }
  #lblHoy.active { color: var(--green-dark); }

  .switch {
    position: relative;
    display: inline-block;
    width: 64px;
    height: 36px;
    flex: 0 0 auto;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    cursor: pointer;
    background: #cbd5e1;
    border-radius: 36px;
    transition: background .2s ease;
  }
  .slider:before {
    content: "";
    position: absolute;
    height: 28px;
    width: 28px;
    left: 4px;
    bottom: 4px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
    transition: transform .2s ease;
  }
  .switch input:checked + .slider { background: var(--green); }
  .switch input:checked + .slider:before { transform: translateX(28px); }
  .switch input:disabled + .slider { opacity: .5; cursor: progress; }

  /* ---- Estado / mensajes ---- */
  .status {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    min-height: 18px;
    margin-top: 6px;
  }
  .status.error { color: #dc2626; font-weight: 700; }

  /* ---- Tabla (scroll propio, cabecera congelada) ---- */
  .table-scroll {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(15,23,42,.06);
    background: #ffffff;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: var(--cell-font);
  }
  thead th {
    background: #f1f5f9;
    color: #475569;
    font-weight: 700;
    font-size: .78em;
    text-transform: uppercase;
    letter-spacing: .03em;
    padding: 9px 6px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 2px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  thead th:first-child { text-align: left; padding-left: 10px; }
  thead th:last-child  { padding-right: 10px; }
  tbody td {
    padding: 7px 6px;
    text-align: center;
    white-space: nowrap;
    color: #1f2937;
    border-bottom: 1px solid #f1f5f9;
  }
  tbody td:first-child { text-align: left; font-weight: 600; padding-left: 10px; }
  tbody td:last-child  { padding-right: 10px; }
  tbody tr:nth-child(even) { background: #fafcff; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover, tbody tr:active { background: #ecfeff; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Cabecera fija -->
  <div class="topbar" id="topbar">
    <div class="cta-bar">
      <button id="btnZoomOut" class="cta cta-icon" aria-label="Reducir zoom general">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
      <button id="btnZoomIn" class="cta cta-icon" aria-label="Aumentar tamaño del texto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
        </svg>
      </button>
      <button id="btnZoomFit" class="cta cta-complete" aria-label="Ver la tabla completa en pantalla">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <span>Todas las Columnas</span>
      </button>
    </div>

    <!-- Interruptor: MES | switch | HOY -->
    <div class="toggle-row">
      <span class="t-label" id="lblMes">MES</span>
      <label class="switch">
        <input type="checkbox" id="toggleActivos">
        <span class="slider"></span>
      </label>
      <span class="t-label" id="lblHoy">HOY</span>
    </div>

    <div class="status" id="status">Cargando…</div>
  </div>

  <div class="table-scroll" id="tableScroll">
    <table id="dataTable">
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
/* ============================================================
   1) CONFIGURACIÓN  —  URL DE APPS SCRIPT
   ============================================================ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUCIQhS-A31S0gJIFE9G5Bio-d59fozLBiRF4Qz4eF6GRlo6HsxtUqM0tIB273crnl/exec";

// URL del CSV publicado del Google Sheet (fuente de datos).
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR1BjbiQM-QP0XSjShP74iarll9RqMh41FakufDxFL6Zdpuih_Uis-PjGpl0soEFqFm2mU3Kpr9hNZL/pub?gid=121579684&single=true&output=csv";

// Columnas que se mostrarán (en este orden).
const COLUMNS = ["Fecha Entrega", "Apto", "Normal", "Sobao", "Matalauva"];

const statusEl = document.getElementById('status');
const theadRow = document.getElementById('theadRow');
const tbody    = document.getElementById('tbody');
const tableEl  = document.getElementById('dataTable');
const scrollEl = document.getElementById('tableScroll');
const toggleEl = document.getElementById('toggleActivos');
const lblMes   = document.getElementById('lblMes');
const lblHoy   = document.getElementById('lblHoy');

let fontSize = 15;
let viewMode = 'fit'; // 'fit' = ajustar ancho a pantalla | 'normal' = zoom manual

function applyFont() {
  document.documentElement.style.setProperty('--cell-font', fontSize + 'px');
}

/* ---------- Altura de la tabla para que la cabecera quede fija ---------- */
function sizeTable() {
  const top = scrollEl.getBoundingClientRect().top;
  const h = window.innerHeight - top - 14;
  scrollEl.style.maxHeight = Math.max(h, 180) + 'px';
}

/* ---------- Parser CSV (soporta comillas y comas internas) ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* ignorar */ }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

/* ---------- Parser de fechas (DD/MM/YYYY, YYYY-MM-DD, etc.) ---------- */
function parseDate(s) {
  s = String(s || '').trim();
  if (!s) return 0;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if (m) {
    let y = +m[3];
    if (y < 100) y += 2000;
    return Date.UTC(y, +m[2] - 1, +m[1]);
  }
  const t = Date.parse(s);
  return isNaN(t) ? 0 : t;
}

/* ---------- Cargar datos del Sheet (sin caché) ---------- */
async function loadData() {
  setStatus("Cargando…", false);
  try {
    const url = CSV_URL + "&_cb=" + Date.now();
    const resp = await fetch(url, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const text = await resp.text();
    renderTable(parseCSV(text));
    setStatus("", false);
    sizeTable();
    if (viewMode === 'fit') completeView();
  } catch (err) {
    setStatus("No se pudieron cargar los datos. Revisa la conexión. (" + err.message + ")", true);
  }
}

function renderTable(rows) {
  theadRow.innerHTML = "";
  tbody.innerHTML = "";
  if (!rows.length) { setStatus("La hoja no tiene datos.", true); return; }

  const header = rows[0].map(h => h.trim());

  let indices = COLUMNS.map(name => {
    const wanted = name.trim().toLowerCase();
    return header.findIndex(h => h.toLowerCase() === wanted);
  });

  let labels = COLUMNS.slice();
  if (indices.every(i => i === -1)) {
    indices = header.map((_, i) => i);
    labels  = header;
  }

  const fechaIdx = (indices.length > 0 && indices[0] !== -1)
    ? indices[0]
    : header.findIndex(h => h.toLowerCase().includes('fecha'));

  indices.forEach((idx, k) => {
    const th = document.createElement('th');
    th.textContent = (idx === -1) ? labels[k] : header[idx];
    theadRow.appendChild(th);
  });

  const dataRows = rows.slice(1).filter(cells =>
    !cells.every(v => (v || "").trim() === "")
  );

  if (fechaIdx !== -1) {
    dataRows.sort((a, b) => parseDate(b[fechaIdx]) - parseDate(a[fechaIdx]));
  }

  for (const cells of dataRows) {
    const tr = document.createElement('tr');
    indices.forEach(idx => {
      const td = document.createElement('td');
      td.textContent = (idx === -1 || cells[idx] === undefined) ? "" : cells[idx];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
}

/* ---------- Interruptor MES / HOY (filtra el pan del día) ---------- */
function setToggleVisual(isOn) {
  toggleEl.checked = isOn;
  lblHoy.classList.toggle('active', isOn);
  lblMes.classList.toggle('active', !isOn);
}

async function setFilter(isOn) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PEGA_AQUI") === 0) {
    setStatus("Falta pegar la URL del Apps Script en el código.", true);
    setToggleVisual(!isOn);
    return;
  }
  toggleEl.disabled = true;
  setStatus("Guardando…", false);
  try {
    const value = isOn ? "TRUE" : "FALSE";
    await fetch(APPS_SCRIPT_URL + "?value=" + value, { method: "GET" });
    localStorage.setItem("soloActivos", value);
    setToggleVisual(isOn);
    await loadData();
  } catch (err) {
    setStatus("No se pudo guardar el cambio. (" + err.message + ")", true);
    setToggleVisual(!isOn);
  } finally {
    toggleEl.disabled = false;
  }
}

/* ---------- Zoom / Ver todas las columnas ---------- */
function zoomOut() {
  viewMode = 'normal';
  fontSize = Math.max(fontSize - 2, 7);
  applyFont();
}

function zoomIn() {
  viewMode = 'normal';
  fontSize = Math.min(fontSize + 2, 44);
  applyFont();
}

// Reduce el texto hasta que toda la tabla quepa de ancho (sin scroll horizontal).
function completeView() {
  viewMode = 'fit';
  fontSize = 16;
  applyFont();
  let guard = 0;
  while (tableEl.scrollWidth > scrollEl.clientWidth && fontSize > 6 && guard < 80) {
    fontSize -= 1;
    applyFont();
    guard++;
  }
}

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (isError ? " error" : "");
}

/* ---------- Eventos ---------- */
document.getElementById('btnZoomOut').addEventListener('click', zoomOut);
document.getElementById('btnZoomIn').addEventListener('click', zoomIn);
document.getElementById('btnZoomFit').addEventListener('click', completeView);
toggleEl.addEventListener('change', () => setFilter(toggleEl.checked));
window.addEventListener('resize', () => { sizeTable(); if (viewMode === 'fit') completeView(); });

// Estado visual inicial del interruptor (no reescribe F2 al cargar).
setToggleVisual(localStorage.getItem("soloActivos") === "TRUE");

applyFont();
sizeTable();
loadData();
</script>
</body>
</html>
